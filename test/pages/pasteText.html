<!doctype html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8" />
    <title>pasteText</title>
    <script src="../../node_modules/vue/dist/vue.min.js"></script>
    <script src="../../dist/w-aggrid-vue.umd.js"></script>
</head>
<body style="margin:0; padding:10px;">
    <!-- 宿主頁只負責擺放各表與提供資料; 貼上由測試以真滑鼠點擊儲存格、真鍵盤 Ctrl+V 觸發(e2e-pasteText.test.mjs), 頁內沒有觸發貼上之按鈕; 呼叫公開方法 pasteText 之契約見 pasteTextApi.html -->
    <div id="app">
        <div>p1: 一般</div>
        <w-aggrid-vue id="p1" ref="p1" style="width:600px;" :height="150" :opt="opt.p1"></w-aggrid-vue>
        <div>p2: 供點表頭排序</div>
        <w-aggrid-vue id="p2" ref="p2" style="width:600px;" :height="150" :opt="opt.p2"></w-aggrid-vue>
        <div>p3: b 隱藏</div>
        <w-aggrid-vue id="p3" ref="p3" style="width:600px;" :height="150" :opt="opt.p3"></w-aggrid-vue>
        <div>p4: b 不可編輯</div>
        <w-aggrid-vue id="p4" ref="p4" style="width:600px;" :height="150" :opt="opt.p4"></w-aggrid-vue>
    </div>
    <script>
        Vue.component('w-aggrid-vue', window['w-aggrid-vue'])
        let mk = function(ext) {
            return Object.assign({
                keys: ['a', 'b', 'c'],
                kpHeadFilterType: { a: 'text', b: 'text', c: 'text' },
                kpCellEditable: { a: true, b: true, c: true },
                rows: [{ a: 'a0', b: 'b0', c: 'c0' }, { a: 'a1', b: 'b1', c: 'c1' }],
            }, ext || {})
        }
        window.__vm = new Vue({
            el: '#app',
            data: function() {
                return {
                    opt: {
                        p1: mk(),
                        p2: mk(),
                        p3: mk({ kpHeadHide: { b: true } }),
                        p4: mk({ kpCellEditable: { a: true, b: false, c: true } }),
                    },
                }
            },
        })
    </script>
</body>
</html>
